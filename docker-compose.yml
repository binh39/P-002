services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://testgen:testgen@db:5432/testgen
      LANGFUSE_HOST: ${LANGFUSE_HOST:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CORS_ORIGINS: http://localhost:3000
      TESTGEN_SHARED_WORKSPACE: /sandbox-work
      TESTGEN_DOCKER_WORKSPACE_VOLUME: p002_testgen_sandbox_work
    depends_on:
      db:
        condition: service_healthy
      sandbox-volume-init:
        condition: service_completed_successfully
    volumes:
      - ./data:/app/data
      - ./src/sample_repo:/app/src/sample_repo:ro
      - ./eval/prompt_optimization/datasets:/app/eval/prompt_optimization/datasets:ro
      - ./eval/dspy_gepa:/app/eval/dspy_gepa
      - sandbox-work:/sandbox-work
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "0"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: testgen
      POSTGRES_USER: testgen
      POSTGRES_PASSWORD: testgen
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testgen -d testgen"]
      interval: 5s
      timeout: 5s
      retries: 10

  sandbox-volume-init:
    build:
      context: .
      dockerfile: sandbox/Dockerfile
    image: testgen-sandbox:latest
    command: ["sh", "-c", "chown -R 1000:1000 /sandbox-work"]
    user: root
    network_mode: none
    volumes:
      - sandbox-work:/sandbox-work
    restart: "no"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  sandbox-work:
    name: p002_testgen_sandbox_work
