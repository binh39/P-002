name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "app/backend/**"
      - "app/tests/**"
      - "app/requirements.txt"
      - "app/requirements-dev.txt"
      - "app/ruff.toml"
      - "app/Dockerfile"
      - "app/.dockerignore"
      - "src/coverup/**"
      - "src/optimization/**"
      - "src/sample_repo/**"
      - "src/sample_repo.rar"
      - "src/sample_repo.zip"
      - "tests/**"
      - "cloud/**"
      - "cloud/Dockerfile.web"
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/backend/**"
      - "app/tests/**"
      - "app/requirements.txt"
      - "app/requirements-dev.txt"
      - "app/ruff.toml"
      - "app/Dockerfile"
      - "app/.dockerignore"
      - "src/coverup/**"
      - "src/optimization/**"
      - "src/sample_repo/**"
      - "src/sample_repo.rar"
      - "src/sample_repo.zip"
      - "tests/**"
      - "cloud/**"
      - "cloud/Dockerfile.web"
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci.yml"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            app/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Extract bundled sample repositories
        working-directory: ${{ github.workspace }}
        run: |
          unzip -q -o src/sample_repo.zip -d src
          test -d src/sample_repo/isort
          test -d src/sample_repo/mimesis
          test -d src/sample_repo/mlxtend
          test -d src/sample_repo/typesystem

      - name: Lint with ruff
        run: ruff format --check backend/ tests/ && ruff check backend/ tests/

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
        env:
          APP_ENV: test
          PYTHONPATH: ${{ github.workspace }}

      - name: Build API image
        run: |
          docker build --file Dockerfile --tag promptopt-api:ci ..

  gepa-lint-test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.13"
          enable-cache: true
      - name: Install locked GEPA environment
        run: uv sync --frozen --group dev
      - name: Extract bundled sample repositories
        run: |
          unzip -q -o src/sample_repo.zip -d src
          test -d src/sample_repo/isort/isort
          test -d src/sample_repo/mimesis/mimesis
          test -d src/sample_repo/mlxtend/mlxtend
          test -d src/sample_repo/typesystem/typesystem
      - name: Check GEPA pipeline
        run: |
          uv run ruff check src/optimization tests/test_coverage_optimization.py tests/test_dataset_builder.py tests/test_runtime_workspace.py cloud/run_job.py cloud/prepare_runtime.py cloud/runtime_workspace.py
          uv run python -m py_compile src/coverup/coverup.py src/optimization/gepa.py src/optimization/metrics.py src/optimization/cli.py src/optimization/runner.py src/optimization/prompts.py cloud/run_job.py
          uv run pytest -p no:pytest_isolate tests -q
      - name: Build GEPA runner image
        run: docker build --file cloud/Dockerfile.web --tag promptopt-gepa-runner:ci .

  sandbox-image-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated project sandbox image
        run: >-
          docker build
          --file cloud/Dockerfile.sandbox
          --build-arg PYTHON_VERSION=${{ matrix.python-version }}
          --tag promptopt-sandbox:py${{ matrix.python-version }} .
      - name: Verify sandbox image contract
        run: |
          docker run --rm promptopt-sandbox:py${{ matrix.python-version }} contract > sandbox-contract.json
          python -c 'import json; p=json.load(open("sandbox-contract.json")); assert p["python_minor"] == "${{ matrix.python-version }}"; assert p["uv_available"] and p["poetry_available"]; assert p["managed_pytest_version"] == "9.1.1"; assert p["managed_coverage_version"] == "7.15.3"; assert not p["forbidden_modules_present"]'
      - name: Upload image contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-contract-py${{ matrix.python-version }}
          path: sandbox-contract.json
          if-no-files-found: warn

  sandbox-docker-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.13"
          enable-cache: true
      - name: Install locked test environment
        run: uv sync --frozen --group dev
      - name: Build Python 3.12 sandbox image
        run: >-
          docker build
          --file cloud/Dockerfile.sandbox
          --build-arg PYTHON_VERSION=3.12
          --tag promptopt-sandbox:py3.12 .
      - name: Run upload, artifact, execution and cache recovery acceptance
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-artifacts/sandbox-docker
          uv run python scripts/run_local_docker_runtime_integration.py \
            --image promptopt-sandbox:py3.12 \
            --exercise-cache-recovery \
            --output ci-artifacts/sandbox-docker/acceptance-summary.json \
            2>&1 | tee ci-artifacts/sandbox-docker/integration.log
      - name: Upload Docker integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-docker-integration-py3.12
          path: ci-artifacts/sandbox-docker
          if-no-files-found: warn
          retention-days: 14
