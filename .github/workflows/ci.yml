name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "codebase/src/**"
      - "codebase/tests/**"
      - "codebase/requirements.txt"
      - "codebase/requirements-dev.txt"
      - "codebase/ruff.toml"
      - "codebase/Dockerfile"
      - "codebase/.dockerignore"
      - "src/coverup/**"
      - "src/optimization/**"
      - "src/sample_repo/**"
      - "src/sample_repo.rar"
      - "src/sample_repo.zip"
      - "tests/**"
      - "cloud/run_job.py"
      - "cloud/Dockerfile.web"
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "codebase/src/**"
      - "codebase/tests/**"
      - "codebase/requirements.txt"
      - "codebase/requirements-dev.txt"
      - "codebase/ruff.toml"
      - "codebase/Dockerfile"
      - "codebase/.dockerignore"
      - "src/coverup/**"
      - "src/optimization/**"
      - "src/sample_repo/**"
      - "src/sample_repo.rar"
      - "src/sample_repo.zip"
      - "tests/**"
      - "cloud/run_job.py"
      - "cloud/Dockerfile.web"
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci.yml"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codebase

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            codebase/requirements.txt
            codebase/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Extract bundled sample repositories
        working-directory: ${{ github.workspace }}
        run: |
          unzip -q -o src/sample_repo.zip -d src
          test -d src/sample_repo/isort
          test -d src/sample_repo/mlxtend
          test -d src/sample_repo/typesystem

      - name: Lint with ruff
        run: ruff format --check src/ tests/ && ruff check src/ tests/

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
        env:
          APP_ENV: test

      - name: Build API image
        run: |
          docker build --file Dockerfile --tag promptopt-api:ci ..

  gepa-lint-test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.13"
          enable-cache: true
      - name: Install locked GEPA environment
        run: uv sync --frozen --group dev
      - name: Extract bundled sample repositories
        run: |
          unzip -q -o src/sample_repo.zip -d src
          test -d src/sample_repo/isort/isort
          test -d src/sample_repo/mlxtend/mlxtend
          test -d src/sample_repo/typesystem/typesystem
      - name: Check GEPA pipeline
        run: |
          uv run ruff check src/optimization tests/test_coverage_optimization.py tests/test_dataset_builder.py cloud/run_job.py
          uv run python -m py_compile src/coverup/coverup.py src/optimization/gepa.py src/optimization/metrics.py src/optimization/cli.py src/optimization/runner.py src/optimization/prompts.py cloud/run_job.py
          uv run pytest -p no:pytest_isolate tests -q
      - name: Build GEPA runner image
        run: docker build --file cloud/Dockerfile.web --tag promptopt-gepa-runner:ci .
