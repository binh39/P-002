name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "codebase/src/**"
      - "codebase/tests/**"
      - "codebase/requirements.txt"
      - "codebase/requirements-dev.txt"
      - "codebase/ruff.toml"
      - "codebase/Dockerfile"
      - "codebase/.dockerignore"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "codebase/src/**"
      - "codebase/tests/**"
      - "codebase/requirements.txt"
      - "codebase/requirements-dev.txt"
      - "codebase/ruff.toml"
      - "codebase/Dockerfile"
      - "codebase/.dockerignore"
      - ".github/workflows/ci.yml"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codebase

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            codebase/requirements.txt
            codebase/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff format --check src/ tests/ && ruff check src/ tests/

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          APP_ENV: test
