name: Frontend CI

on:
  pull_request:
    branches: [main]
    paths:
      - "app/frontend/**"
      - "firebase.json"
      - ".github/workflows/frontend-*.yml"
  push:
    branches: [main]
    paths:
      - "app/frontend/**"
      - "firebase.json"
      - ".github/workflows/frontend-*.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/frontend/.nvmrc
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm audit --omit=dev
